<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="250" viewBox="0 0 1120 250" role="img" aria-labelledby="title"><title id="title">Halo Moon</title><style>@keyframes drift{to{transform:translateX(-280px)}}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.wave{animation:drift 12s linear infinite}.headline{animation:enter 200ms cubic-bezier(0.23,1,0.32,1) both}@media(prefers-reduced-motion:reduce){.wave,.headline{animation:none}}</style><defs><linearGradient id="warm" x1="0" x2="1" y1="0" y2="0"><stop stop-color="#FF5F6D"/><stop offset=".55" stop-color="#FF9671"/><stop offset="1" stop-color="#FFC371"/></linearGradient></defs><defs><clipPath id="headerClip"><path d="M0 0H1120V207Q840 272 560 208T0 211Z"/></clipPath></defs><path d="M0 0H1120V207Q840 272 560 208T0 211Z" fill="url(#warm)"/><g clip-path="url(#headerClip)"><path class="wave" d="M-280 198q70 -25 140 0t140 0q70 -25 140 0t140 0q70 -25 140 0t140 0q70 -25 140 0t140 0q70 -25 140 0t140 0q70 -25 140 0t140 0v80H-280Z" fill="#fff" opacity=".2"/></g><g class="headline"><text x="560" y="112" font-size="76" fill="#542642" font-weight="700" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif">Halo Moon</text><text x="560" y="159" font-size="22" fill="#542642" font-weight="500" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif">halomoon.cn</text></g></svg>
