name: Refresh profile graphics
on:
  workflow_dispatch:
  schedule:
    - cron: '24 2 * * *'
  push:
    branches: [main]
    paths:
      - profile.json
      - scripts/render_profile.py
      - scripts/finalize_snake.py
      - .github/workflows/profile-graphics.yml
permissions:
  contents: read
concurrency:
  group: profile-graphics
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Render public statistics and profile graphics
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/render_profile.py --output _generated
      - name: Generate this account's contribution animation
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: Hole333
          outputs: |
            _generated/snake-light.svg?color_snake=#D94B70&color_dots=#f4eef2,#f9d4dd,#f4a6b9,#e67c9c,#c64d76
            _generated/snake-dark.svg?palette=github-dark&color_snake=#FFAF7B&color_dots=#211b2c,#483046,#73405d,#a85776,#e87d9b
      - name: Add reduced-motion fallbacks
        run: python scripts/finalize_snake.py _generated
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: profile-graphics
          path: _generated/
          retention-days: 1
  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: profile-graphics
          path: _generated/
      - name: Commit generated images only
        shell: bash
        run: |
          git pull --ff-only origin main
          mkdir -p assets/template
          cp _generated/*.svg assets/template/
          cp _generated/profile-data.json assets/template/
          git add assets/template
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile graphics [skip ci]"
          git push origin HEAD:main
