name: Refresh profile panels and snake
on:
  workflow_dispatch:
  schedule:
    - cron: '24 2 * * *'
  push:
    branches: [main]
    paths:
      - scripts/finalize_snake.py
      - scripts/render_profile_panels.py
      - profile.json
      - .github/workflows/contribution-snake.yml
permissions:
  contents: read
concurrency:
  group: contribution-snake
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Render public profile panels
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/render_profile_panels.py --output _profile
      - name: Generate Hole333 contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: Hole333
          outputs: |
            _generated/snake-light.svg?color_snake=#0969da&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            _generated/snake-dark.svg?palette=github-dark&color_snake=#58a6ff&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
      - name: Add reduced-motion variants
        run: python scripts/finalize_snake.py _generated
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contribution-snake
          path: |
            _generated/*.svg
            _profile/
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: contribution-snake
          path: _download/
      - name: Commit contribution images only
        shell: bash
        run: |
          git pull --ff-only origin main
          mkdir -p assets/contributions assets/profile
          cp _download/_generated/*.svg assets/contributions/
          cp _download/_profile/* assets/profile/
          git add assets/profile
          git add assets/contributions/snake-light.svg assets/contributions/snake-dark.svg assets/contributions/activity-static-light.svg assets/contributions/activity-static-dark.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh public profile panels and snake [skip ci]"
          git push origin HEAD:main
